name: Validate Challenge Structure

on:
  pull_request:
    paths:
      - 'challenges/**'

jobs:
  check-index:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Validate challenge structure
      run: python scripts/validate_challenges.py
